project:
  name: "agentP"
  display_name: "agentP — Nền Tảng Điều Phối Đa Trí Tuệ Nhân Tạo"
  slug: "agentp"
  version: "1.0.0"
  description: "Nền tảng điều phối đa agent với bàn làm việc duy nhất (Single-Desk Lead/PM), giao diện Light Mode cảm hứng Agent Perry the Platypus, tích hợp studio thiết kế Tldraw + Onlook."
  
theme:
  style: "Clean Minimalist Light Mode"
  identity: "Precision Stealth Agent (Original Geometric Monogram)"
  canvas_background: "#F8FAFC"
  panel_background: "#FFFFFF"
  primary_teal: "#0D9488"
  tint_teal: "#CCFBF1"
  accent_amber: "#D97706"
  checkpoint_bg: "#FFFBEB"
  strictly_no_neon: true

architecture:
  command_model: "Single-Desk SPOC (Bạn ⇄ Alex)"
  backstage_swarm: 14_roles
  local_daemon:
    name: "9router-proxy"
    host: "127.0.0.1"
    port: 51730
    session_reuse: true # Tái sử dụng claude login, gh auth, cursor tokens
  design_studio:
    phase_1: "tldraw (Infinite Ideation Whiteboard)"
    phase_2: "onlook (Live DOM-to-Code WYSIWYG AST Sync)"
  kanban_system:
    mode: "tri_modal_agentic"
    mode_a_embedded: "Cột phải Bàn làm việc (Trang 2)"
    mode_b_drawer: "Slide-over Drawer phím tắt Cmd+B"
    mode_c_full_board: "Full-Screen Dedicated Studio (Trang 10)"
    single_source_of_truth: ".agents/db.sqlite"
    columns:
      - "1_backlog"
      - "2_todo"
      - "3_swarm_coding"
      - "4_testing_review"
      - "5_user_checkpoint_gate"
      - "6_done"

