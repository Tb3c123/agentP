<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="pGradTeal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="fedoraBrownH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#692C07"/>
    </linearGradient>
  </defs>

  <!-- ICON BADGE (LEFT) -->
  <g transform="translate(15, 12)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#pGradTeal2)"/>
    <rect x="1" y="1" width="94" height="94" rx="23" fill="none" stroke="#CCFBF1" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Subtle Fedora & P Monogram -->
    <g transform="translate(48, 55)">
      <!-- Authentic Brown Fedora Hat (Tilted atop P) -->
      <g transform="translate(0, -26) rotate(-7)">
        <ellipse cx="2" cy="4" rx="23" ry="5" fill="url(#fedoraBrownH)"/>
        <path d="M -10 3 L -9 -11 C -9 -13, -5 -15, 2 -15 C 8 -15, 12 -13, 12 -11 L 13 3 Z" fill="url(#fedoraBrownH)"/>
        <rect x="-10" y="-1" width="23" height="4" fill="#1E293B"/>
        <circle cx="-6" cy="1" r="1" fill="#F59E0B"/>
      </g>

      <!-- Stem of P -->
      <rect x="-16" y="-17" width="9" height="38" rx="3" fill="#FFFFFF"/>

      <!-- Loop of P -->
      <path d="M -16 -17 H -2 C 9 -17, 16 -10, 16 -1 C 16 8, 9 15, -2 15 H -16 Z" fill="#FFFFFF"/>
      <path d="M -7 -9 H -2 C 4 -9, 8 -5, 8 -1 C 8 3, 4 7, -2 7 H -7 Z" fill="#0D9488"/>
    </g>
  </g>

  <!-- WORDMARK TYPOGRAPHY (RIGHT) -->
  <g transform="translate(130, 20)">
    <!-- "agent" in clean charcoal -->
    <text x="0" y="58" fill="#0F172A" font-size="52" font-weight="800" letter-spacing="-1">agent</text>
    
    <!-- "P" in Alpine Teal -->
    <text x="146" y="58" fill="#0D9488" font-size="56" font-weight="900" letter-spacing="-1">P</text>

    <!-- Subtle Fedora Silhouette floating right above the dot of 'P' -->
    <g transform="translate(186, 20) scale(0.65) rotate(-6)">
      <ellipse cx="0" cy="3" rx="18" ry="4" fill="url(#fedoraBrownH)"/>
      <path d="M -8 2 L -7 -9 C -7 -11, -3 -12, 1 -12 C 6 -12, 9 -11, 10 -9 L 10 2 Z" fill="url(#fedoraBrownH)"/>
      <rect x="-8" y="-1" width="18" height="3" fill="#1E293B"/>
    </g>

    <!-- Baseline Description -->
    <text x="4" y="84" fill="#64748B" font-size="12" font-weight="700" letter-spacing="3.5">PRECISION MULTI-AGENT PLATFORM</text>
  </g>
</svg>