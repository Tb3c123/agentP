        <text x="210" y="27" fill="#0D9488" font-size="12" font-weight="600">Gemini 2.5 Flash</text>
        <text x="430" y="27" fill="#475569" font-size="11" font-family="'JetBrains Mono', monospace">sess_fe_david_03</text>
        <text x="630" y="27" fill="#10B981" font-size="11">95ms</text>
        <rect x="750" y="12" width="100" height="22" rx="4" fill="#ECFDF5"/>
        <text x="800" y="27" text-anchor="middle" fill="#047857" font-size="10" font-weight="bold">✓ Connected</text>
      </g>

