        <text x="20" y="27" fill="#0F172A" font-size="12" font-weight="bold">Carlos (Backend Dev)</text>
        <text x="210" y="27" fill="#0D9488" font-size="12" font-weight="600">Claude 3.5 Sonnet</text>
        <text x="430" y="27" fill="#475569" font-size="11" font-family="'JetBrains Mono', monospace">sess_be_carlos_04</text>
        <text x="630" y="27" fill="#10B981" font-size="11">138ms</text>
        <rect x="750" y="12" width="100" height="22" rx="4" fill="#ECFDF5"/>
        <text x="800" y="27" text-anchor="middle" fill="#047857" font-size="10" font-weight="bold">✓ Connected</text>
      </g>

      <!-- Row 5: Viktor QA Lead -->
      <g transform="translate(0, 258)">
        <rect x="0" y="0" width="888" height="46" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
