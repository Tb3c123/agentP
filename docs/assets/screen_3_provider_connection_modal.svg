      <line x1="0" y1="0" x2="888" y2="0" stroke="#E2E8F0"/>
      <rect x="0" y="18" width="180" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" cursor="pointer"/>
      <text x="90" y="44" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">Tải cấu hình từ .env</text>

      <rect x="688" y="18" width="200" height="42" rx="6" fill="url(#primaryTeal)" cursor="pointer"/>
      <text x="788" y="44" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">Lưu Cấu Hình &amp; Bắt Đầu</text>
