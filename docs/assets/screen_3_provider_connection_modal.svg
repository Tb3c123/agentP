    <text x="64" y="32" fill="#0F172A" font-size="16" font-weight="800">Cấu Hình Provider &amp; Cô Lập Session 1:1 Qua agentP Core Daemon</text>
    <text x="64" y="49" fill="#64748B" font-size="12">Mỗi vai trò (role) được gán model và session độc lập, bảo mật, tránh xung đột context</text>
    <text x="910" y="38" fill="#94A3B8" font-size="18" font-weight="bold" cursor="pointer">✕</text>

