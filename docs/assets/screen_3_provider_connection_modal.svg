      <text x="38" y="39" fill="#047857" font-size="11">Tự động điều phối API keys, rate-limit, fallback failover và đồng bộ session CLI</text>
      <rect x="730" y="10" width="140" height="30" rx="5" fill="#FFFFFF" stroke="#A7F3D0" cursor="pointer"/>
      <text x="800" y="29" text-anchor="middle" fill="#047857" font-size="11" font-weight="bold">🔄 Kiểm tra kết nối</text>
