<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" style="background:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="primaryTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  
  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1440" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="1440" y2="56" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- AgentP Brand with Fedora Accent -->
  <g transform="translate(28, 14)">
    
    <path d="M4 20 C4 18, 8 16, 18 16 C28 16, 32 18, 32 20 L35 22 C35 23, 33 24, 18 24 C3 24, 1 23, 1 22 Z" fill="#78350F"/>
    <path d="M8 16 L10 6 C10 4.5, 14 3, 18 3 C22 3, 26 4.5, 26 6 L28 16 Z" fill="#78350F"/>
    <rect x="9.5" y="13" width="17" height="2.5" fill="#0D9488" rx="0.8"/>

    <text x="42" y="20" fill="#0F172A" font-size="16" font-weight="800" letter-spacing="-0.5">agent</text>
    <text x="86" y="20" fill="#0D9488" font-size="18" font-weight="900">P</text>
  </g>

  <!-- Breadcrumb / Active Page Indicator -->
  <rect x="160" y="15" width="220" height="26" rx="6" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
  <circle cx="174" cy="28" r="3.5" fill="#0D9488"/>
  <text x="185" y="32" fill="#0F766E" font-size="11" font-weight="700">Trang 8: Quản Lý &amp; Cài Đặt Dự Án</text>

  <!-- Project Selector Pill -->
  <rect x="395" y="15" width="220" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="408" y="32" fill="#64748B" font-size="11">Dự án: <tspan fill="#0F172A" font-weight="700" font-family="'JetBrains Mono', monospace">FoodDelivery-Loyalty</tspan></text>

  <!-- Quick Nav Tabs -->
  <g transform="translate(635, 16)">
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#FFFFFF"/>
    <text x="40" y="16" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">Bàn làm việc</text>

    <rect x="90" y="0" width="85" height="24" rx="4" fill="#FFFFFF"/>
    <text x="132" y="16" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">Kanban Studio</text>

    <rect x="185" y="0" width="85" height="24" rx="4" fill="#FFFFFF"/>
    <text x="227" y="16" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">UI/UX Studio</text>

    <rect x="280" y="0" width="75" height="24" rx="4" fill="#FFFFFF"/>
    <text x="317" y="16" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">Code &amp; Diff</text>
  </g>

  <!-- Host Status & Token Meter -->
  <g transform="translate(1120, 15)">
    <rect x="0" y="0" width="145" height="26" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="12" cy="13" r="3.5" fill="#10B981"/>
    <text x="22" y="17" fill="#047857" font-size="11" font-weight="600">Host: 192.168.1.15</text>
    
    <rect x="155" y="0" width="135" height="26" rx="6" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
    <text x="165" y="17" fill="#0F766E" font-size="11" font-weight="600">🪙 42.5k saved</text>
  </g>


  <!-- Dimmed overlay -->
  <rect x="0" y="56" width="1440" height="844" fill="#0F172A" fill-opacity="0.3"/>

  <!-- Centered Settings Dialog -->
  <g transform="translate(370, 110)">
    <rect x="0" y="0" width="700" height="660" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="700" height="60" rx="12" fill="#F8FAFC"/>
    <line x1="0" y1="60" x2="700" y2="60" stroke="#E2E8F0"/>
    <text x="30" y="36" fill="#0F172A" font-size="16" font-weight="800">⚙️ CÀI ĐẶT DỰ ÁN: FoodDelivery-Loyalty-App</text>
    <text x="650" y="36" fill="#94A3B8" font-size="18" font-weight="bold" cursor="pointer">✕</text>

    <!-- General Settings Form -->
    <g transform="translate(30, 80)">
      <text x="0" y="16" fill="#0F172A" font-size="13" font-weight="bold">Tên Dự Án:</text>
      <rect x="0" y="26" width="640" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="16" y="51" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', monospace">FoodDelivery-Loyalty-App</text>

      <text x="0" y="96" fill="#0F172A" font-size="13" font-weight="bold">Thư Mục Làm Việc:</text>
      <rect x="0" y="106" width="640" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="16" y="131" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', monospace">~/Projects/FoodDelivery-Loyalty-App</text>

      <text x="0" y="176" fill="#0F172A" font-size="13" font-weight="bold">Mô Tả Bài Toán:</text>
      <rect x="0" y="186" width="640" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="16" y="210" fill="#475569" font-size="12">Ứng dụng đặt đồ ăn trực tuyến trên Flutter &amp; NestJS có giỏ hàng, tích điểm voucher.</text>
    </g>

    <!-- DANGER ZONE: Antigravity-style Double Confirmation -->
    <g transform="translate(30, 360)">
      <rect x="0" y="0" width="640" height="190" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="10" fill="#DC2626"/>
      <text x="28" y="32" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold">⚠️</text>
      <text x="46" y="32" fill="#9F1239" font-size="13" font-weight="bold">VÙNG NGUY HIỂM: XÓA HOÀN TOÀN DỰ ÁN</text>
      <text x="20" y="58" fill="#881337" font-size="11">Hành động này sẽ xóa toàn bộ mã nguồn, cấu hình .agents/db.sqlite và lịch sử chat.</text>
      <text x="20" y="74" fill="#881337" font-size="11">Để xác nhận, vui lòng gõ chính xác tên dự án <tspan font-weight="bold" font-family="'JetBrains Mono', monospace">FoodDelivery-Loyalty-App</tspan> vào ô bên dưới:</text>

      <!-- Input box to confirm -->
      <rect x="20" y="90" width="600" height="38" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
      <text x="32" y="114" fill="#0F172A" font-size="12" font-family="'JetBrains Mono', monospace">FoodDelivery-Loyalty-App</text>

      <!-- Danger Delete Button -->
      <rect x="20" y="138" width="600" height="38" rx="6" fill="#DC2626" cursor="pointer"/>
      <text x="320" y="162" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">🗑️ TÔI HIỂU HỆ QUẢ, XÓA DỰ ÁN NÀY VĨNH VIỄN</text>
    </g>

    <!-- Dialog Footer -->
    <g transform="translate(30, 580)">
      <line x1="0" y1="0" x2="640" y2="0" stroke="#E2E8F0"/>
      <rect x="0" y="20" width="160" height="42" rx="6" fill="#F8FAFC" stroke="#CBD5E1" cursor="pointer"/>
      <text x="80" y="46" text-anchor="middle" fill="#475569" font-size="12" font-weight="bold">Đóng</text>

      <rect x="460" y="20" width="180" height="42" rx="6" fill="url(#primaryTeal)" cursor="pointer"/>
      <text x="550" y="46" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">Lưu Cài Đặt</text>
    </g>
  </g>
</svg>