    <text x="85" y="60" fill="#0F766E" font-size="12">Hệ thống hỗ trợ xuất file Excel tổng hợp: danh sách file, số dòng code, agent đảm nhiệm, và số token tiêu thụ.</text>
    
    <rect x="800" y="25" width="175" height="40" rx="6" fill="#0D9488" cursor="pointer"/>
    <text x="887" y="50" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="bold">📥 Xuất file .xlsx ngay</text>

    <!-- File Inspector & Preview Container -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="1000" height="680" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
      
      <!-- Top meta header -->
      <rect x="0" y="0" width="1000" height="50" rx="10" fill="#F8FAFC"/>
      <line x1="0" y1="50" x2="1000" y2="50" stroke="#E2E8F0"/>
      <text x="24" y="31" fill="#0F172A" font-size="13" font-weight="bold" font-family="'JetBrains Mono', monospace">lib/features/cart/cart_bloc.dart</text>
      <rect x="340" y="14" width="130" height="22" rx="4" fill="#F0FDFA" stroke="#CCFBF1"/>
      <text x="405" y="29" text-anchor="middle" fill="#0F766E" font-size="10" font-weight="bold">Author: David (FE)</text>
      <text x="500" y="30" fill="#64748B" font-size="11">Cập nhật: 3 phút trước • 128 dòng • 1.4k tokens</text>

      <!-- Code Preview Lines -->
      <g transform="translate(24, 70)" font-family="'JetBrains Mono', monospace" font-size="12">
        <text x="0" y="20" fill="#94A3B8">01</text>
        <text x="40" y="20" fill="#0D9488">import</text>
        <text x="95" y="20" fill="#0F172A">'package:flutter_bloc/flutter_bloc.dart';</text>

        <text x="0" y="44" fill="#94A3B8">02</text>
        <text x="40" y="44" fill="#0D9488">import</text>
        <text x="95" y="44" fill="#0F172A">'models/cart_item.dart';</text>

        <text x="0" y="68" fill="#94A3B8">03</text>
        
        <text x="0" y="92" fill="#94A3B8">04</text>
        <text x="40" y="92" fill="#0D9488">class</text>
        <text x="85" y="92" fill="#0F172A">CartBloc</text>
        <text x="155" y="92" fill="#0D9488">extends</text>
        <text x="215" y="92" fill="#0F172A">Bloc&lt;CartEvent, CartState&gt; &#123;</text>

        <text x="0" y="116" fill="#94A3B8">05</text>
        <text x="60" y="116" fill="#0F172A">CartBloc() : super(CartInitial()) &#123;</text>

        <text x="0" y="140" fill="#94A3B8">06</text>
        <text x="80" y="140" fill="#0F172A">on&lt;ApplyVoucherEvent&gt;((event, emit) &#123;</text>

        <text x="0" y="164" fill="#94A3B8">07</text>
        <text x="100" y="164" fill="#64748B">// Tính toán mức chiết khấu voucher</text>

        <text x="0" y="188" fill="#94A3B8">08</text>
        <text x="100" y="188" fill="#0D9488">final</text>
        <text x="145" y="188" fill="#0F172A">discount = event.code == 'GIAM20K' ? 20000 : 0;</text>

        <text x="0" y="212" fill="#94A3B8">09</text>
        <text x="100" y="212" fill="#0F172A">emit(CartUpdated(discount: discount));</text>

        <text x="0" y="236" fill="#94A3B8">10</text>
        <text x="80" y="236" fill="#0F172A">&#125;);</text>

        <text x="0" y="260" fill="#94A3B8">11</text>
        <text x="60" y="260" fill="#0F172A">&#125;</text>

        <text x="0" y="284" fill="#94A3B8">12</text>
        <text x="40" y="284" fill="#0F172A">&#125;</text>
      </g>
    </g>
