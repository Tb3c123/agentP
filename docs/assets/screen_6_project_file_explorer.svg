    <rect x="0" y="0" width="1000" height="90" rx="10" fill="#F0FDFA" stroke="#CCFBF1" filter="url(#cardShadow)"/>
    <circle cx="45" cy="45" r="22" fill="#0D9488"/>
    <text x="45" y="52" text-anchor="middle" fill="#FFFFFF" font-size="18">📊</text>
