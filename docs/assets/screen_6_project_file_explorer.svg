    <line x1="0" y1="48" x2="360" y2="48" stroke="#E2E8F0"/>

    <!-- Tree items -->
    <g transform="translate(20, 64)">
      <!-- Root -->
      <text x="0" y="16" fill="#0F172A" font-size="12" font-weight="bold">📦 FoodDelivery-Loyalty-App/</text>

      <g transform="translate(16, 28)">
        <text x="0" y="16" fill="#64748B" font-size="12">📁 .agents/ (SQLite DB &amp; Configs)</text>
        <text x="16" y="38" fill="#0D9488" font-size="11" font-family="'JetBrains Mono', monospace">db.sqlite [Maya]</text>
        <text x="16" y="58" fill="#0D9488" font-size="11" font-family="'JetBrains Mono', monospace">project.yaml [Alex]</text>

        <text x="0" y="86" fill="#64748B" font-size="12">📁 lib/ (Frontend Flutter)</text>
        <text x="16" y="106" fill="#0D9488" font-size="11" font-family="'JetBrains Mono', monospace">main.dart [David]</text>
        <text x="16" y="126" fill="#0D9488" font-size="11" font-family="'JetBrains Mono', monospace">features/cart/cart_bloc.dart [David]</text>
        <text x="16" y="146" fill="#0D9488" font-size="11" font-family="'JetBrains Mono', monospace">features/cart/cart_view.dart [Elena]</text>

        <text x="0" y="174" fill="#64748B" font-size="12">📁 src/ (Backend NestJS)</text>
        <text x="16" y="194" fill="#0D9488" font-size="11" font-family="'JetBrains Mono', monospace">cart/cart.controller.ts [Carlos]</text>
        <text x="16" y="214" fill="#0D9488" font-size="11" font-family="'JetBrains Mono', monospace">cart/cart.service.ts [Carlos]</text>

        <text x="0" y="242" fill="#64748B" font-size="12">📁 test/ (Kiểm Thử Tự Động)</text>
        <text x="16" y="262" fill="#047857" font-size="11" font-family="'JetBrains Mono', monospace">cart_bloc_test.dart [Viktor] ✓</text>
        <text x="16" y="282" fill="#047857" font-size="11" font-family="'JetBrains Mono', monospace">cart_api_e2e_spec.ts [Viktor] ✓</text>

        <text x="0" y="310" fill="#64748B" font-size="12">📁 docs/ (Tài Liệu Kỹ Thuật &amp; PRD)</text>
        <text x="16" y="330" fill="#475569" font-size="11">MULTI_AGENT_APP_SPEC.md [Marcus]</text>
